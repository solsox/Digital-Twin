[project]
name = "vdl-fvirtual"
version = "0.1.0"
description = "Plataforma v1 para piloto de FFR virtual (Fundación Valle del Lili). Esqueleto no clínico."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydicom>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.engines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
